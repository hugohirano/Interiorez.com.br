name: Deploy to GitHub Pages

on:
  # Publica a cada push na branch main (troque se sua branch tiver outro nome)
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install, build, and upload site
        uses: withastro/action@v6
        # with:
        #   path: .            # pasta do projeto Astro dentro do repo (se não for a raiz)
        #   node-version: 24
        #   package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
